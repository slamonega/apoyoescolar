<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apoyo Escolar - Aprende gratis: Matemáticas, Español, Ciencias y más</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ===== APP ===== -->
  <div id="app" class="app">
    <div class="topbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="user-area">
        <select id="lang-select" class="lang-select" onchange="setLang(this.value)" title="Idioma">
          <option value="es">🇪🇸 ES</option>
          <option value="en">🇬🇧 EN</option>
          <option value="de">🇩🇪 DE</option>
        </select>
        <button class="btn btn-outline" style="padding: 0.4em 0.9em; font-size: 0.9em;" onclick="showProgress()">📊 Mi progreso</button>
      </div>
    </div>
    <div class="stats-bar" id="stats-bar"></div>
    <div class="page" id="page"></div>
  </div>

  <!-- ===== xAPI / LRS SETTINGS MODAL ===== -->
  <div class="modal-overlay" id="xapi-modal">
    <div class="modal">
      <h2>⚙️ xAPI (LRS)</h2>
      <p style="color:#666;font-size:0.9em;margin-bottom:1em;">
        Cada respuesta se registra como un statement xAPI estándar. Sin LRS, los statements se guardan localmente y se envían cuando configures uno.
      </p>
      <div class="form-group">
        <label>Nombre del aprendiz</label>
        <input type="text" id="xapi-name" placeholder="Tu nombre" />
      </div>
      <div class="form-group">
        <label>Email (opcional, para el actor mbox)</label>
        <input type="email" id="xapi-email" placeholder="tucorreo@ejemplo.com" />
      </div>
      <div class="form-group">
        <label>LRS endpoint</label>
        <input type="url" id="xapi-endpoint" placeholder="https://tu-lrs.com/data/xAPI/statements" />
      </div>
      <div class="form-group">
        <label>LRS usuario</label>
        <input type="text" id="xapi-username" placeholder="Basic Auth user" />
      </div>
      <div class="form-group">
        <label>LRS contraseña</label>
        <input type="password" id="xapi-password" placeholder="Basic Auth password" />
      </div>
      <div class="error-msg" id="xapi-status"></div>
      <button class="btn btn-primary" style="width: 100%; font-size: 1.05em;" onclick="saveXAPISettings()">Guardar</button>
      <button class="btn btn-outline" style="width: 100%; margin-top: 0.6em;" onclick="flushXAPI()">Enviar pendientes ahora</button>
    </div>
  </div>

  <!-- ===== FEEDBACK ===== -->
  <div class="feedback" id="feedback">
    <div class="feedback-card">
      <div class="fb-emoji" id="fb-emoji">🎉</div>
      <h2 id="fb-title">¡Correcto!</h2>
      <div class="fb-stars" id="fb-stars">⭐⭐⭐</div>
      <div class="fb-points" id="fb-points">+10 puntos</div>
      <button class="btn btn-primary" id="fb-next" onclick="nextExercise()">Continuar</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/catalog.js"></script>
  <script src="/js/xapi.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
